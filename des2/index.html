<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Responsive con CSS Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="contenedor">

        <header class="header">
            <h1>HEADER</h1>
        </header>

        <aside class="aside">
            <h2>ASIDE</h2>

            <ul>
                <li>Inicio</li>
                <li>Servicios</li>
                <li>Portafolio</li>
                <li>Contacto</li>
            </ul>
        </aside>

        <main class="main">
            <h2>MAIN</h2>

            <p>
                Este es el contenido principal del sitio web.
                El diseño utiliza CSS Grid para distribuir
                las secciones Header, Aside, Main y Footer.
            </p>

            <div class="cards">
                <div class="card">Tarjeta 1</div>
                <div class="card">Tarjeta 2</div>
                <div class="card">Tarjeta 3</div>
            </div>

        </main>

        <footer class="footer">
            <h2>FOOTER</h2>
        </footer>

    </div>

</body>

</html>
